spring.sql.init.enabled=true

# H2 in-memory — self-contained, no external DB needed
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;IGNORECASE=TRUE;
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=Admin
spring.datasource.password=

spring.jpa.database-platform=com.vmsac.vmsacserver.config.ExtendedH2Dialect
spring.sql.init.platform=h2
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=update

server.address=0.0.0.0

# Mock Pi/NVR-dependent endpoints so the demo works without hardware
demo.mode=true
