# H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=com.vmsac.vmsacserver.config.TestH2Dialect

# Skip SQL init scripts — Hibernate creates all tables from entities
spring.sql.init.mode=never

# Jasypt encryption password (required even if no ENC(...) values are used)
jasypt.encryptor.password=test

# Disable real mail sending in tests
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
